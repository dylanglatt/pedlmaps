name: EAS Update

# Publishes an over-the-air JS update to the "preview" channel on every push to main.
# (Native changes — new modules, icon/name, permissions — still need a real `eas build`.)
on:
  push:
    branches: [main]

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: 27.1.0
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Publish update
        run: eas update --branch preview --environment preview --message "${{ github.event.head_commit.message }}" --non-interactive
