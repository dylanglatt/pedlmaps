name: Snapshot availability

# Collects live Citi Bike station availability for the prediction/validation work.
# DEVELOPER data collection only — touches nothing the app ships.
#
# Runs every 15 minutes and pushes each snapshot as its own small timestamped CSV
# to the dedicated `snapshots` branch. It deliberately does NOT commit to main, so
# it never triggers eas-update.yml. Pull the data later with:
#   git fetch origin snapshots && git worktree add snap snapshots
#
# Note: GitHub's scheduler is best-effort — runs can be delayed or skipped under
# load, so the real spacing won't be exactly 15 min. Each row carries its own
# timestamp, so that's fine. You can also trigger a run manually from the Actions
# tab (Run workflow) to seed the branch immediately.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snapshot-availability
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main (for the script)
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Take snapshot and push to the snapshots branch
        run: |
          set -euo pipefail
          TS=$(TZ=America/New_York date +%Y%m%dT%H%M%S)
          mkdir -p out
          SNAP_CSV="out/${TS}.csv" python3 scripts/snapshot_availability.py

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Attach a worktree for the snapshots branch (create it as an orphan the
          # first time so it shares no history with main).
          if git ls-remote --exit-code --heads origin snapshots >/dev/null 2>&1; then
            git fetch --depth=1 origin snapshots
            git worktree add snap origin/snapshots
            git -C snap checkout -B snapshots
          else
            git worktree add --detach snap
            git -C snap checkout --orphan snapshots
            git -C snap rm -rf . >/dev/null 2>&1 || true
          fi

          mkdir -p snap/data
          cp out/*.csv snap/data/
          git -C snap add data
          git -C snap commit -m "snapshot ${TS}" || { echo "nothing to commit"; exit 0; }
          git -C snap push origin snapshots
